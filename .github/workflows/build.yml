# Builds the desktop client for Linux and Windows on every push and pull request.
# Each run uploads a ready-to-run, self-contained archive per platform (no .NET install needed).
# Pushing a tag like v0.2.0 also publishes both archives as a GitHub release.
name: Build client

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: scripts/test.sh

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/TGK.Client -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:DebugType=none -p:SatelliteResourceLanguages=en -o publish/TGK

      # tar keeps the executable bit on Linux; Windows users expect a zip.
      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: tar -czf TGK-${{ matrix.rid }}.tar.gz -C publish TGK
      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/TGK -DestinationPath TGK-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: TGK-${{ matrix.rid }}
          path: TGK-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes
